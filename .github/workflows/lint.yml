name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -x bin/devbox install.sh
      - name: cloud-init is valid YAML
        run: |
          python3 -c 'import sys, yaml; yaml.safe_load(open("lib/cloud-init.yaml"))'
